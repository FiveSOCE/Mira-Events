name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: b6f8138d628b2d082d36bab49ee49ffa93796fb1
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            build/libs/MiraEvents-0.1.0.jar \
            --target b6f8138d628b2d082d36bab49ee49ffa93796fb1 \
            --title "MiraEvents v0.1.0" \
            --notes "Initial MiraEvents release with persistent scheduled and recurring event lifecycle control, countdowns, command chains, manual start/stop, PlaceholderAPI and public ServicesManager API."
