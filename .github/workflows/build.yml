name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraEvents-0.2.0
          path: build/libs/MiraEvents-0.2.0.jar

      - name: Publish v0.2.0 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.0 >/dev/null 2>&1; then
            gh release create v0.2.0 \
              build/libs/MiraEvents-0.2.0.jar \
              --target "${{ github.sha }}" \
              --title "MiraEvents v0.2.0" \
              --notes "Merges MiraAnnouncements and MiraRestart into MiraEvents: configurable rotating chat/actionbar/title announcements with optional click/hover actions, manual announcements, safe restart countdowns, save hooks, typed pre-restart event, and optional timezone-aware automatic restart windows."
          fi
