name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraEvents-0.2.2
          path: build/libs/MiraEvents-0.2.2.jar
          if-no-files-found: error
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2 >/dev/null 2>&1; then
            gh release upload v0.2.2 build/libs/MiraEvents-0.2.2.jar --clobber
          else
            gh release create v0.2.2 build/libs/MiraEvents-0.2.2.jar --target "${{ github.sha }}" --title "MiraEvents v0.2.2" --notes "Migrates the bundled Enhanced Airdrops, Mega Pinata, Mob Frenzy and Harvest Rush presets into existing events.yml files without overwriting custom events."
          fi
